#VRML_SIM R2025a utf8

PROTO CleaningBrush [
  field SFVec3f translation 0 0 0.06
  field SFRotation rotation 0 0 1 0
  field SFString name "nao_cleaning_brush"
  field SFString mode "vacuum"
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
%< if (fields.mode.value === "vacuum") { >%
      Transform {
        translation 0 0 0.025
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.12 0.16 0.20 roughness 0.72 metalness 0 }
            geometry Box { size 0.34 0.23 0.045 }
          }
        ]
      }
      Transform {
        translation -0.025 0 0.068
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.22 0.27 0.31 roughness 0.55 metalness 0.1 }
            geometry Box { size 0.22 0.15 0.07 }
          }
        ]
      }
      Transform {
        translation 0.12 0 0.05
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.85 0.34 0.12 roughness 0.5 metalness 0.05 }
            geometry Box { size 0.025 0.19 0.018 }
          }
        ]
      }
      Transform {
        translation -0.15 0 0.07
        rotation 0 1 0 1.5708
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.12 0.16 0.20 roughness 0.72 metalness 0 }
            geometry Cylinder { height 0.07 radius 0.055 }
          }
        ]
      }
%< } else { >%
      Transform {
        translation 0 0 0.012
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.30 0.34 0.36 roughness 1 metalness 0 }
            geometry Box { size 0.34 0.25 0.025 }
          }
        ]
      }
      Transform {
        translation 0 0 0.027
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.16 0.48 0.58 roughness 1 metalness 0 }
            geometry Box { size 0.29 0.20 0.008 }
          }
        ]
      }
      Transform {
        translation -0.11 0 0.05
        children [
          Shape {
            appearance PBRAppearance { baseColor 0.18 0.22 0.24 roughness 0.8 metalness 0 }
            geometry Box { size 0.045 0.08 0.055 }
          }
        ]
      }
%< } >%
    ]
  }
}
